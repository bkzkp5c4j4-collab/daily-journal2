<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>Daily Journal</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#171717;--muted:#292929;--green:#55a56b;--yellow:#f5d943;--white:#f5f5f5;--gray:#888}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:env(safe-area-inset-top) 16px calc(100px + env(safe-area-inset-bottom));}
button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:0}
.app{max-width:720px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 10px}.circle{width:54px;height:54px;border-radius:50%;background:#202020;font-size:28px}.week-title{font-weight:700;color:var(--yellow);font-size:20px}.progress{height:10px;background:#202020;border-radius:20px;margin:0 auto 24px;max-width:75%;overflow:hidden}.progress>i{display:block;height:100%;background:var(--green);border-radius:20px;width:0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:28px}.day{background:transparent;border-radius:12px;padding:7px 0 9px;color:#aaa}.day .dow{font-size:13px;font-weight:700}.day .num{font-size:25px;margin-top:8px;color:#eee}.day.active .dow,.day.active .num{color:var(--yellow)}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:32px;overflow:auto}.chip{background:#171717;color:#888;padding:13px 16px;border-radius:16px;white-space:nowrap;font-weight:700}.chip.active{color:var(--yellow);background:#242018}.today-count{margin-left:auto;text-align:center;min-width:78px;background:#171717;border-radius:18px;padding:7px 12px;color:#888}.today-count b{display:block;font-size:22px;color:#eee}
h2{font-size:23px;margin:22px 2px 14px}.habit{margin:0 0 28px}.habit-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.habit-name{font-size:21px;font-weight:750}.habit-actions{display:flex;gap:8px}.mini{background:#1d1d1d;color:#aaa;border-radius:9px;padding:7px 9px;font-size:13px}.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}.cell{height:49px;border-radius:0;background:#292929}.cell:first-child{border-radius:9px 0 0 9px}.cell:last-child{border-radius:0 9px 9px 0}.cell.done{background:var(--green)}.cell.selected{outline:2px solid var(--yellow);outline-offset:-3px}
.panel{background:#151515;border:1px solid #242424;border-radius:18px;padding:16px;margin:16px 0}.field{width:100%;background:#242424;color:white;border:1px solid #333;border-radius:12px;padding:13px;outline:none}.field:focus{border-color:var(--green)}textarea.field{min-height:130px;resize:vertical}.row{display:flex;gap:9px}.primary{background:var(--green);color:#07100a;border-radius:12px;padding:13px 16px;font-weight:800}.secondary{background:#292929;border-radius:12px;padding:13px 16px}.muted{color:#888}.bottom{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(94%,700px);background:#1c1c1c;border:1px solid #444;border-radius:40px;padding:7px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 5px 30px #000}.nav{background:transparent;color:#ddd;border-radius:32px;padding:8px 2px;font-size:12px}.nav .ico{display:block;font-size:24px;margin-bottom:3px}.nav.active{background:#080808;color:var(--yellow);font-weight:800}
.stat{font-size:32px;font-weight:800;color:var(--green)}.barrow{display:grid;grid-template-columns:65px 1fr 42px;gap:10px;align-items:center;margin:13px 0}.bar{height:12px;border-radius:20px;background:#292929;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.empty{text-align:center;color:#777;padding:35px 10px}.danger{color:#e88}.hidden{display:none!important}.small{font-size:12px;color:#888;line-height:1.5}
@media(min-width:600px){body{padding-top:30px}.circle{width:60px;height:60px}.habit-name{font-size:23px}.cell{height:55px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><button class="circle" id="menuBtn" aria-label="メニュー">☰</button><div class="week-title" id="periodLabel">今週 ▾</div><button class="circle" id="addOpen" aria-label="習慣を追加">＋</button></header>
  <div class="progress"><i id="weekProgress"></i></div>
  <div class="days" id="days"></div>
  <div class="filters" id="filters">
    <button class="chip active" data-filter="すべて">すべて</button>
    <button class="chip" data-filter="運動する">運動する</button>
    <button class="chip" data-filter="マインド">マインド</button>
    <button class="chip" data-filter="生産性">生産性</button>
    <div class="today-count"><b id="count">0/0</b><span class="small">達成</span></div>
  </div>
  <main id="main"></main>
</div>
<nav class="bottom">
 <button class="nav active" data-tab="journal"><span class="ico">☑</span>ジャーナル</button>
 <button class="nav" data-tab="trend"><span class="ico">▥</span>トレンド</button>
 <button class="nav" data-tab="notes"><span class="ico">▤</span>ノート</button>
 <button class="nav" data-tab="reminders"><span class="ico">♟</span>リマインダー</button>
 <button class="nav" data-tab="settings"><span class="ico">⚙</span>設定</button>
</nav>
<script>
const KEY='daily-journal-v1';
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const addDays=(iso,n)=>{let d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const startWeek=iso=>{let d=new Date(iso+'T12:00:00');d.setDate(d.getDate()-d.getDay());return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const defaults=[
{id:crypto.randomUUID(),name:'腹筋トレーニング',category:'運動する',logs:[]},
{id:crypto.randomUUID(),name:'英語の動画を観る',category:'マインド',logs:[]},
{id:crypto.randomUUID(),name:'読書をする',category:'生産性',logs:[]}
];
let data;try{data=JSON.parse(localStorage.getItem(KEY))||{habits:defaults,notes:{},reminder:'21:00'}}catch{data={habits:defaults,notes:{},reminder:'21:00'}}
let selected=todayISO(),tab='journal',filter='すべて';
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderDays(){let start=startWeek(selected);$('periodLabel').textContent='今週 ▾';$('days').innerHTML=Array.from({length:7},(_,i)=>{let d=addDays(start,i),date=new Date(d+'T12:00:00');return `<button class="day ${d===selected?'active':''}" data-date="${d}"><div class="dow">${'日月火水木金土'[i]}</div><div class="num">${date.getDate()}</div></button>`}).join('');$('days').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()})}
function renderJournal(){let start=startWeek(selected),items=data.habits.filter(h=>filter==='すべて'||h.category===filter);let done=items.filter(h=>h.logs.includes(selected)).length;$('count').textContent=`${done}/${items.length}`;let all=data.habits.length?data.habits.filter(h=>h.logs.includes(selected)).length/data.habits.length*100:0;$('weekProgress').style.width=all+'%';$('main').innerHTML=items.length?'<h2>習慣</h2>'+items.map(h=>`<section class="habit"><div class="habit-head"><div class="habit-name">${esc(h.name)}</div><div class="habit-actions"><button class="mini" data-edit="${h.id}">編集</button></div></div><div class="weekbar">${Array.from({length:7},(_,i)=>{let d=addDays(start,i);return `<button class="cell ${h.logs.includes(d)?'done':''} ${d===selected?'selected':''}" title="${d}" data-habit="${h.id}" data-date="${d}"></button>`}).join('')}</div></section>`).join(''):'<div class="empty">習慣がありません。＋から追加できます。</div>';$('main').querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{let h=data.habits.find(x=>x.id===b.dataset.habit);h.logs=h.logs.includes(b.dataset.date)?h.logs.filter(x=>x!==b.dataset.date):[...h.logs,b.dataset.date];save();render()});$('main').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editHabit(b.dataset.edit))}
function renderTrend(){let start=startWeek(todayISO()),days=Array.from({length:7},(_,i)=>addDays(start,i));let possible=data.habits.length*7,done=data.habits.reduce((s,h)=>s+days.filter(d=>h.logs.includes(d)).length,0),pct=possible?Math.round(done/possible*100):0;$('main').innerHTML=`<h2>今週のトレンド</h2><div class="panel"><div class="stat">${pct}%</div><div class="muted">週間達成率　${done}/${possible} 回</div></div><div class="panel"><h3>習慣ごとの達成状況</h3>${data.habits.map(h=>{let n=days.filter(d=>h.logs.includes(d)).length;return `<div class="barrow"><span>${esc(h.name)}</span><div class="bar"><i style="width:${n/7*100}%"></i></div><b>${n}/7</b></div>`}).join('')||'<p class="muted">習慣を追加すると表示されます。</p>'}</div><p class="small">表示は今週（日曜〜土曜）の記録です。</p>`}
function renderNotes(){let val=data.notes[selected]||'';$('main').innerHTML=`<h2>ノート</h2><div class="muted">${selected}</div><div class="panel"><textarea class="field" id="noteText" placeholder="今日の出来事、気づき、考えたこと...">${esc(val)}</textarea><p class="small">入力内容はこの端末に自動保存されます。</p></div>`;$('noteText').oninput=e=>{data.notes[selected]=e.target.value;save()}}
function renderReminders(){$('main').innerHTML=`<h2>リマインダー</h2><div class="panel"><p>毎日の通知時刻</p><input class="field" type="time" id="reminderTime" value="${esc(data.reminder||'21:00')}"><p class="small">通知を使うには、ホーム画面に追加したアプリを開き、通知を許可してください。ブラウザやiPhoneの設定によって動作が異なります。</p><button class="primary" id="saveReminder">時刻を保存</button></div>`;$('saveReminder').onclick=()=>{data.reminder=$('reminderTime').value;save();alert('時刻を保存しました。通知の自動配信は今後の追加機能です。')}}
function renderSettings(){$('main').innerHTML=`<h2>設定</h2><div class="panel"><h3>データについて</h3><p class="small">記録は現在このブラウザ内に保存されています。別の端末との同期・バックアップはまだありません。</p><button class="secondary" id="export">データを書き出す（JSON）</button></div><div class="panel"><button class="secondary danger" id="reset">すべてのデータを初期化</button></div>`;$('export').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='journal-backup.json';a.click();URL.revokeObjectURL(a.href)};$('reset').onclick=()=>{if(confirm('すべての記録を削除します。よろしいですか？')){localStorage.removeItem(KEY);location.reload()}}}
function render(){renderDays();document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({journal:renderJournal,trend:renderTrend,notes:renderNotes,reminders:renderReminders,settings:renderSettings}[tab])()}
function addHabit(){let name=prompt('習慣の名前を入力してください');if(!name||!name.trim())return;let category=prompt('カテゴリを入力（運動する / マインド / 生産性）','運動する')||'運動する';data.habits.push({id:crypto.randomUUID(),name:name.trim(),category,logs:[]});save();render()}
function editHabit(id){let h=data.habits.find(x=>x.id===id);let name=prompt('習慣名を編集（削除する場合は空欄）',h.name);if(name===null)return;if(!name.trim()){if(confirm('この習慣を削除しますか？'))data.habits=data.habits.filter(x=>x.id!==id)}else h.name=name.trim();save();render()}
$('addOpen').onclick=addHabit;$('menuBtn').onclick=()=>{filter='すべて';tab='settings';render()};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;tab='journal';render()});document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
